<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Para Mi Bebe</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        canvas { display: block; }
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); color: white;
            display: flex; justify-content: center; align-items: center;
            flex-direction: column; z-index: 10; cursor: pointer;
            transition: opacity 1s ease;
        }
        #overlay h1 { font-family: sans-serif; font-size: 2rem; text-align: center; pointer-events: none; }
        #overlay p { font-family: sans-serif; font-size: 1rem; margin-top: 10px; opacity: 0.8; pointer-events: none; }
        .heart-beat { animation: beat 1s infinite alternate; }
        @keyframes beat { from { transform: scale(1); } to { transform: scale(1.1); } }
    </style>
</head>
<body>

    <div id="overlay">
        <h1 class="heart-beat">Hola Bebe</h1>
        <h1>Espero te guste</h1>
        <p>(Usa el dedo o mouse para girar y hacer zoom)</p>
    </div>

    <audio id="bgMusic" loop hidden>
        <source src="assets/musica.mp3" type="audio/mpeg">
    </audio>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { FontLoader } from 'three/addons/loaders/FontLoader.js';
        import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';

        const config = {
            frases: ["TE AMO", "ERES MI TODO", "SIEMPRE JUNTOS", "TE ADORO", "MI VIDA", "MI LUNA", "MI SOL", "SOLO TÚ", "POR SIEMPRE", "❤️"], 
            imagenes: [
                'assets/foto1.jpg', 
                'assets/foto2.jpg', 
                'assets/foto3.jpg'
            ],
            colorCorazon: 0xff0040,
            colorTexto: 0xffd700,
            velocidadGiro: 0.002,
            cantidadEstrellas: 10000, // ¡Muchísimas más estrellas!
            cantidadFotos: 45,        // Más fotos orbitando
            radioGalaxia: 35
        };

        let scene, camera, renderer, controls, heartMesh;
        const floatingGroup = new THREE.Group();
        const starsGroup = new THREE.Group();
        const clock = new THREE.Clock();

        function init() {
            scene = new THREE.Scene();
            
            camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 15, 60);

            renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            // Efecto de estela: fondo negro con ligera transparencia en cada frame
            renderer.setClearColor(0x000000, 1); 
            document.body.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            // Luces potentes para que el corazón brille
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);
            
            const pointLight = new THREE.PointLight(config.colorCorazon, 5, 100);
            scene.add(pointLight);

            createHeart();
            createMassiveStarfield();
            loadFloatingContent();

            window.addEventListener('resize', onWindowResize);
            
            document.getElementById('overlay').addEventListener('click', () => {
                document.getElementById('overlay').style.display = 'none';
                document.getElementById('bgMusic').play();
            });
        }

        function createHeart() {
            const x = 0, y = 0;
            const heartShape = new THREE.Shape();
            heartShape.moveTo( x + 5, y + 5 );
            heartShape.bezierCurveTo( x + 5, y + 5, x + 4, y, x, y );
            heartShape.bezierCurveTo( x - 6, y, x - 6, y + 7,x - 6, y + 7 );
            heartShape.bezierCurveTo( x - 6, y + 11, x - 3, y + 15.4, x + 5, y + 19 );
            heartShape.bezierCurveTo( x + 12, y + 15.4, x + 16, y + 11, x + 16, y + 7 );
            heartShape.bezierCurveTo( x + 16, y + 7, x + 16, y, x + 10, y );
            heartShape.bezierCurveTo( x + 7, y, x + 5, y + 5, x + 5, y + 5 );

            const extrudeSettings = { depth: 4, bevelEnabled: true, bevelSize: 1.5, bevelThickness: 1.5 };
            const geometry = new THREE.ExtrudeGeometry(heartShape, extrudeSettings);
            geometry.center();

            const material = new THREE.MeshStandardMaterial({ 
                color: config.colorCorazon,
                emissive: config.colorCorazon,
                emissiveIntensity: 1.2, // El corazón ahora brilla intensamente
                roughness: 0.2
            });

            heartMesh = new THREE.Mesh(geometry, material);
            heartMesh.rotation.z = Math.PI;
            scene.add(heartMesh);
        }

        function createMassiveStarfield() {
            const geo = new THREE.BufferGeometry();
            const pos = [];
            const colors = [];
            for (let i = 0; i < config.cantidadEstrellas; i++) {
                pos.push((Math.random() - 0.5) * 400, (Math.random() - 0.5) * 400, (Math.random() - 0.5) * 400);
                // Estrellas de varios colores suaves
                colors.push(0.8 + Math.random() * 0.2, 0.8 + Math.random() * 0.2, 1); 
            }
            geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
            geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
            
            const mat = new THREE.PointsMaterial({ size: 0.4, vertexColors: true, transparent: true, opacity: 0.8 });
            const stars = new THREE.Points(geo, mat);
            starsGroup.add(stars);
            scene.add(starsGroup);
        }

        function loadFloatingContent() {
            const loader = new THREE.TextureLoader();
            const fontLoader = new FontLoader();
            
            // 1. Añadir muchas fotos
            for (let i = 0; i < config.cantidadFotos; i++) {
                const tex = loader.load(config.imagenes[i % config.imagenes.length]);
                const mat = new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide });
                const mesh = new THREE.Mesh(new THREE.PlaneGeometry(5, 5), mat);
                
                setRandomPos(mesh, config.radioGalaxia);
                floatingGroup.add(mesh);
            }

            // 2. Añadir mensajes
            fontLoader.load('https://unpkg.com/three@0.160.0/examples/fonts/helvetiker_bold.typeface.json', (font) => {
                for (let i = 0; i < 30; i++) {
                    const frase = config.frases[i % config.frases.length];
                    const geo = new TextGeometry(frase, { font: font, size: 2, height: 0.5 });
                    geo.center();
                    const mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: config.colorTexto }));
                    setRandomPos(mesh, config.radioGalaxia + 10);
                    floatingGroup.add(mesh);
                }
            });

            scene.add(floatingGroup);
        }

        function setRandomPos(obj, radius) {
            const angle = Math.random() * Math.PI * 2;
            const r = radius + (Math.random() - 0.5) * 20;
            obj.position.set(Math.cos(angle) * r, (Math.random() - 0.5) * 30, Math.sin(angle) * r);
            obj.userData = { speed: 0.005 + Math.random() * 0.01, offset: Math.random() * 10 };
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            const t = clock.getElapsedTime();
            controls.update();

            if (heartMesh) {
                heartMesh.scale.setScalar(0.5 + Math.sin(t * 4) * 0.05);
                heartMesh.rotation.y += 0.01;
            }

            floatingGroup.rotation.y += config.velocidadGiro;
            starsGroup.rotation.y += 0.0005;

            floatingGroup.children.forEach(child => {
                child.position.y += Math.sin(t + child.userData.offset) * 0.05;
                // Esto hace que siempre miren a la cámara y NO se vean en espejo
                child.quaternion.copy(camera.quaternion);
            });

            renderer.render(scene, camera);
        }

        init();
        animate();
    </script>
</body>
</html>
